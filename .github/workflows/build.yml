name: Build iOS App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create Secrets File
        run: cp ios/Secrets.swift.example ios/Secrets.swift

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Application
        run: |
          xcodebuild -project OverByte.xcodeproj \
                     -scheme OverByte \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/OverByte.app Payload/
          zip -r OverByte.ipa Payload
          rm -rf Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OverByte-IPA
          path: OverByte.ipa
