name: OverByte
options:
  bundleIdPrefix: com.vuhamthieu
targets:
  OverByte:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ios
    info:
      path: ios/Info.plist
      properties:
        NSBluetoothAlwaysUsageDescription: "Sending commands to ESP32"
        UIAppFonts:
          - PressStart2P-Regular.ttf
    settings:
      base:
        CODE_SIGNING_ALLOWED: "No"
        CODE_SIGNING_REQUIRED: "No"
        CODE_SIGN_IDENTITY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  OverByteTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests
    dependencies:
      - target: OverByte
    settings:
      base:
        CODE_SIGNING_ALLOWED: "No"
        CODE_SIGNING_REQUIRED: "No"
        CODE_SIGN_IDENTITY: ""
