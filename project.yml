name: OverByte
options:
  bundleIdPrefix: com.vuhamthieu
targets:
  OverByte:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ios
    info:
      path: ios/Info.plist
      properties:
        NSBluetoothAlwaysUsageDescription: "Sending commands to ESP32"
        NSHealthShareUsageDescription: "Reading steps, heart rate and calories for the Activity watch face"
        NSHealthUpdateUsageDescription: "Writing activity data is not used, but required by the HealthKit authorization API"
        UIAppFonts:
          - PressStart2P-Regular.ttf
    entitlements:
      path: ios/OverByte.entitlements
      properties:
        com.apple.developer.healthkit: true
    capabilities:
      - type: healthKit
    settings:
      base:
        CODE_SIGNING_ALLOWED: "No"
        CODE_SIGNING_REQUIRED: "No"
        CODE_SIGN_IDENTITY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  OverByteTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests
    dependencies:
      - target: OverByte
    settings:
      base:
        CODE_SIGNING_ALLOWED: "No"
        CODE_SIGNING_REQUIRED: "No"
        CODE_SIGN_IDENTITY: ""
