name: OverByte
options:
  bundleIdPrefix: com.vuhamthieu
targets:
  OverByte:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: ios
    info:
      path: ios/Info.plist
      properties:
        NSCameraUsageDescription: "Streaming retro video to OLED"
        NSBluetoothAlwaysUsageDescription: "Sending commands to ESP32"
        NSHealthShareUsageDescription: "Reading steps, heart rate and calories for the Activity watch face"
        UIAppFonts:
          - PressStart2P-Regular.ttf
    entitlements:
      path: ios/OverByte.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access:
          - health-records
    settings:
      base:
        CODE_SIGNING_ALLOWED: "No"
        CODE_SIGNING_REQUIRED: "No"
        CODE_SIGN_IDENTITY: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
